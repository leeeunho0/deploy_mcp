name: 스프링CI/CD

on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest    #git 안에 컴퓨터 만들어줘 (운영체제)

    steps:
      - uses: actions/checkout@v6
      - run : ls -l

      #자바 코드를 검사하기 위해서는 JDK를 다운
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      #git actions안에 컴퓨터한테 그래들 실행해라!
      - run: chmod +x ./gradlew

      # 실제로 빌드해라! (테스트 진행 포함!그래서
      # 옵션 -x test 테스트진행을 제외!)
      - run: ./gradlew build -x test

      #jar가 만들어졌는지 확인하기
      - run: ls -l build/libs

      #jar를 EC2로 전송하기
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: build/libs/deploy_mcp-0.0.1-SNAPSHOT.jar
          target: /home/ubuntu/
          strip_components: 2